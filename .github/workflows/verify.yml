name: Verify implementations

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the conformance suite
        run: ./elc test

      - name: Upload report and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ github.sha }}
          path: reports/
